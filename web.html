<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupos del Día - Metro de Madrid Señales</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #dce8f5; min-height: 100vh; }

    header { background: #1a5fa8; padding: 10px 20px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
    .header-text { flex: 1; }
    .header-text h1 { font-size: 18px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 0.8px; }
    .header-text p { font-size: 10px; color: rgba(255,255,255,.8); margin-top: 2px; }
    .badge { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); border-radius: 6px; padding: 5px 12px; text-align: center; }
    .badge .turno { font-size: 13px; font-weight: 700; color: #fff; letter-spacing: 1.5px; }
    .badge .fecha { font-size: 18px; font-weight: 700; color: #fff; margin-top: 2px; letter-spacing: 0.5px; }

    .container { max-width: 1200px; margin: 14px auto; padding: 0 12px 24px; }

    .instrucciones { background: white; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; border-left: 3px solid #1a5fa8; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .instrucciones h3 { color: #1a5fa8; font-size: 12px; margin-bottom: 5px; }
    .instrucciones ol { margin-left: 14px; font-size: 10px; color: #444; line-height: 1.7; }
    .instrucciones code { background: #f0f5fb; padding: 1px 4px; border-radius: 3px; font-size: 9px; color: #1a5fa8; }

    .controles { background: white; border-radius: 8px; padding: 10px 16px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.05); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .controles label { font-size: 11px; font-weight: 600; color: #333; }
    .controles input[type="date"] { font-size: 11px; padding: 4px 7px; border: 1px solid #ccc; border-radius: 4px; }
    .controles input[type="file"] { font-size: 11px; flex: 1; min-width: 160px; }

    .btn { border: none; border-radius: 6px; padding: 7px 16px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .btn-cargar { background: #1a5fa8; color: white; }
    .btn-cargar:hover { background: #0d3d6e; }
    .btn-imprimir { background: #2ecc71; color: white; display: none; }
    .btn-imprimir:hover { background: #27ae60; }

    .seccion-titulo { display: flex; align-items: center; gap: 8px; margin: 16px 0 8px; }
    .seccion-titulo h2 { font-size: 14px; font-weight: 700; color: #1a5fa8; text-transform: uppercase; letter-spacing: 0.6px; }
    .seccion-linea { flex: 1; height: 2px; background: linear-gradient(to right, #1a5fa8, transparent); }
    .seccion-badge { background: #1a5fa8; color: #fff; font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 12px; }

    .galibo-titulo { font-size: 11px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.6px; margin: 8px 0 5px; padding-left: 5px; border-left: 3px solid #1a5fa8; }

    .grupos-grid { display: flex; flex-direction: column; gap: 5px; }

    .grupo-card {
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      display: grid;
      grid-template-columns: 90px 1fr 320px;
      align-items: stretch;
      page-break-inside: avoid;
    }

    .card-header {
      background: #1a5fa8;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 80px;
    }
    .card-header.aluche { background: #0d3d6e; }
    
    .grupo-num { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
    .linea-badge { background: rgba(255,255,255,.3); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }
    .trio-badge { background: #ff8c00; color: #fff; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 8px; text-transform: uppercase; margin-top: 2px; }

    .card-main {
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ots-section { display: flex; flex-direction: column; gap: 3px; }
    .ot-row { display: flex; align-items: center; gap: 8px; }
    .ot-num { background: #1a5fa8; color: white; font-size: 17px; font-weight: 700; padding: 5px 10px; border-radius: 4px; min-width: 110px; letter-spacing: 0.5px; text-align: center; flex-shrink: 0; }
    .ot-desc { font-size: 14px; font-weight: 600; color: #222; line-height: 1.4; flex: 1; }

    .info-destacada {
      margin-top: 3px;
      padding: 5px 10px;
      background: #fff9e6;
      border-left: 3px solid #ffa500;
      border-radius: 0 4px 4px 0;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .info-item { font-size: 11px; display: flex; align-items: center; gap: 4px; }
    .info-label { font-weight: 700; color: #ff8c00; }
    .info-val { color: #333; font-weight: 600; }

    .obs-destacada {
      margin-top: 3px;
      padding: 6px 10px;
      background: #ffe6e6;
      border-left: 4px solid #cc0000;
      border-radius: 0 4px 4px 0;
      font-size: 12px;
      font-weight: 700;
      color: #cc0000;
      line-height: 1.3;
    }

    .card-personas {
      padding: 10px 16px;
      background: #f8fafd;
      border-left: 2px solid #e0e6f0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      min-width: 320px;
    }

    .persona-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff; flex-shrink: 0; }
    .av-aux { background: #1a5fa8; } .av-ofi { background: #0d3d6e; } .av-trio { background: #ff8c00; }
    
    .pinfo { flex: 1; min-width: 0; }
    .pinfo .nombre { font-size: 13px; font-weight: 700; color: #1a1a1a; line-height: 1.2; }
    .pinfo .detalles { font-size: 11px; color: #666; margin-top: 2px; }
    .pinfo .detalles .dne { color: #888; }
    .pinfo .detalles .sep { color: #ccc; margin: 0 4px; }
    .pinfo .detalles .cargo { color: #1a5fa8; font-weight: 600; }

    .empty-state { text-align: center; padding: 40px 20px; color: #888; }
    .empty-state .icon { font-size: 38px; margin-bottom: 10px; }
    .no-grupos { color: #888; padding: 12px; font-size: 11px; }

    .anotaciones-espacio {
      margin-top: 16px;
      padding: 12px;
      background: white;
      border-radius: 6px;
      border: 2px dashed #ccc;
      min-height: 80px;
    }
    .anotaciones-titulo { font-size: 10px; font-weight: 700; color: #666; text-transform: uppercase; margin-bottom: 6px; }

    .seccion-titulo.sin-ot h2 { color: #777; }
    .seccion-titulo.sin-ot .seccion-linea { background: linear-gradient(to right, #999, transparent); }
    .seccion-titulo.sin-ot .seccion-badge { background: #999; }

    .rebajados { margin-top: 12px; display: inline-block; min-width: 320px; max-width: 100%; background: #f4f4f4; border: 1px solid #ccc; border-left: 3px solid #777; border-radius: 4px; padding: 6px 10px; page-break-inside: avoid; }
    .rebajados-titulo { font-size: 10px; font-weight: 700; color: #555; text-transform: uppercase; margin-bottom: 3px; }
    .rebajado-row { font-size: 11px; color: #222; line-height: 1.5; }
    .rebajado-row .obs { color: #666; font-style: italic; }

    @media print {
      @page { 
        size: A4 landscape; 
        margin: 8mm;
      }
      body { background: white; }
      header { -webkit-print-color-adjust: exact; print-color-adjust: exact; padding: 5px 12px; box-shadow: none; }
      .header-text h1 { font-size: 13px; }
      .header-text p { font-size: 8px; }
      .badge { padding: 3px 8px; }
      .badge .turno { font-size: 10px; }
      .badge .fecha { font-size: 16px; }
      .container { margin: 0; padding: 0; max-width: 100%; }
      .instrucciones, .controles, .btn-imprimir { display: none !important; }
      .seccion-titulo { margin: 6px 0 4px; }
      .seccion-titulo h2 { font-size: 11px; }
      .seccion-badge { font-size: 8px; }
      .galibo-titulo { margin: 5px 0 3px; font-size: 9px; }
      .grupos-grid { gap: 3px; }
      .grupo-card { box-shadow: none; border: 1px solid #ddd; grid-template-columns: 80px 1fr 300px; }
      .card-header { padding: 6px 10px; min-width: 70px; }
      .grupo-num { font-size: 14px; }
      .linea-badge { font-size: 10px; padding: 2px 6px; }
      .trio-badge { font-size: 8px; }
      .card-main { padding: 8px 14px; gap: 5px; }
      .ot-num { font-size: 15px; padding: 4px 8px; min-width: 100px; }
      .ot-desc { font-size: 12px; }
      .ots-section { gap: 2px; }
      .info-destacada { margin-top: 2px; padding: 4px 8px; gap: 10px; }
      .info-item { font-size: 9px; }
      .obs-destacada { margin-top: 2px; padding: 4px 8px; font-size: 10px; }
      .card-personas { padding: 8px 12px; gap: 6px; min-width: 280px; }
      .persona-row { gap: 7px; }
      .avatar { width: 28px; height: 28px; font-size: 12px; }
      .pinfo .nombre { font-size: 12px; }
      .pinfo .detalles { font-size: 10px; }
      .anotaciones-espacio { margin-top: 10px; padding: 8px; min-height: 50px; }
      .anotaciones-titulo { font-size: 9px; }
      .rebajados { margin-top: 6px; padding: 4px 8px; }
      .rebajado-row { font-size: 9px; }
      .card-header, .avatar, .ot-num, .seccion-linea, .seccion-badge, .info-destacada, .obs-destacada { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-text">
    <h1>&#128338; Grupos del Día</h1>
    <p>Metro de Madrid &mdash; Señales</p>
  </div>
  <div class="badge">
    <div class="turno" id="turno-badge">NOCHE</div>
    <div class="fecha" id="fecha-badge">-</div>
  </div>
</header>

<div class="container">
  <div class="instrucciones">
    <h3>&#128196; Cómo cargar los grupos</h3>
    <ol>
      <li>Ejecuta <code>Generar Grupos</code> en el Excel</li>
      <li>Descarga el Excel (<strong>Archivo → Descargar una copia</strong>)</li>
      <li>Selecciona el archivo (y la fecha si no es la última), pulsa <strong>Cargar grupos</strong></li>
    </ol>
  </div>

  <div class="controles">
    <label>&#128197; Fecha:</label>
    <input type="date" id="fechaInput" />
    <label>&#128194; Excel:</label>
    <input type="file" id="fileInput" accept=".xlsx,.xlsm,.xls" />
    <button class="btn btn-cargar" onclick="cargarExcel()">Cargar grupos</button>
    <button class="btn btn-imprimir" id="btnImprimir" onclick="window.print()">&#128438; Imprimir</button>
  </div>

  <div id="contenido">
    <div class="empty-state">
      <div class="icon">&#128203;</div>
      <p>Selecciona un archivo Excel</p>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>

const GALIBO_ESTRECHO = ['L01','L1','L02','L2','L03','L3','L04','L4','L05','L5','LM1'];
const GALIBO_ANCHO = ['L06','L6','L07','L7','L08','L8','L09','L9','L10','L11','L12'];

function esEstrecho(linea) {
  const l = linea.toUpperCase().trim();
  return GALIBO_ESTRECHO.some(g => l === g || l.startsWith(g + '-'));
}

// Convierte la celda de fecha (número de Excel o texto) a dd/mm/aaaa
function fechaTexto(v) {
  if (v === undefined || v === null || v === '') return '';
  if (typeof v === 'number') {
    const d = new Date(Math.round((v - 25569) * 86400000));
    return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + d.getUTCFullYear();
  }
  const p = v.toString().trim().split(/[\/.\-]/);
  if (p.length !== 3) return '';
  let y = parseInt(p[2]); if (y < 100) y += 2000;
  return String(parseInt(p[0])).padStart(2, '0') + '/' + String(parseInt(p[1])).padStart(2, '0') + '/' + y;
}
function claveFecha(f) { const p = f.split('/'); return p[2] + p[1] + p[0]; }

function cargarExcel() {
  const fileInput = document.getElementById('fileInput');
  const file = fileInput.files[0];
  if (!file) { alert('Selecciona un archivo Excel'); return; }

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const sheetName = wb.SheetNames.find(n => n.toUpperCase() === 'ASIGNACIONES');
      if (!sheetName) { alert('No se encuentra ASIGNACIONES.\nEjecuta el script primero.'); return; }

      const sheet = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });
      if (rows.length < 2) { alert('ASIGNACIONES vacía.'); return; }

      // Fecha elegida; si no hay, la última fecha que tenga ASIGNACIONES
      const fechaInput = document.getElementById('fechaInput').value;
      let fechaFiltro = '';
      if (fechaInput) {
        const p = fechaInput.split('-');
        fechaFiltro = p[2] + '/' + p[1] + '/' + p[0];
      } else {
        let max = null;
        for (let i = 1; i < rows.length; i++) {
          const f = fechaTexto(rows[i][0]);
          if (f && (!max || claveFecha(f) > claveFecha(max))) max = f;
        }
        fechaFiltro = max || '';
      }

      const grupos = [];
      const rebajados = [];
      const t = v => (v === undefined || v === null ? '' : v).toString().trim();
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        const fechaFila = fechaTexto(r[0]);
        if (!fechaFila || fechaFila !== fechaFiltro) continue;
        const recinto = t(r[1]).toUpperCase();
        if (recinto === 'REBAJADO') {
          rebajados.push({ nombre: t(r[3]), obs: t(r[19]).replace(/^Rebajado - asignación manual:?\s*/i, '') });
          continue;
        }
        grupos.push({
          fecha: fechaFila, recinto: recinto,
          num: t(r[2]),
          p1: t(r[3]), dne1: t(r[4]), cat1: t(r[5]),
          p2: t(r[6]), dne2: t(r[7]), cat2: t(r[8]),
          p3: t(r[9]), dne3: t(r[10]), cat3: t(r[11]),
          linea: t(r[12]),
          ot1: t(r[13]), denom1: t(r[14]),
          ot2: t(r[15]), denom2: t(r[16]),
          furgoneta: t(r[17]), telefono: t(r[18]),
          observaciones: t(r[19])
        });
      }

      if (grupos.length === 0) { alert(fechaFiltro ? 'No hay grupos para ' + fechaFiltro : 'No hay grupos.'); return; }
      mostrarGrupos(grupos, rebajados, fechaFiltro);
    } catch(err) { alert('Error: ' + err.message); }
  };
  reader.readAsArrayBuffer(file);
}

function mostrarGrupos(grupos, rebajados, fechaFiltro) {
  document.getElementById('fecha-badge').textContent = fechaFiltro || 'Todos';

  // Separar por gálibo (mezclando Aluche y Ventas); sin línea = sin OT asignada
  const estrecho = grupos.filter(g => g.linea && esEstrecho(g.linea));
  const ancho = grupos.filter(g => g.linea && !esEstrecho(g.linea));
  const sinOT = grupos.filter(g => !g.linea);
  sinOT.sort((a, b) => (a.recinto + String(a.num).padStart(3, '0')).localeCompare(b.recinto + String(b.num).padStart(3, '0')));

  // Ordenar por línea
  estrecho.sort((a, b) => a.linea.localeCompare(b.linea));
  ancho.sort((a, b) => a.linea.localeCompare(b.linea));

  let html = '';
  
  // Sección Gálibo Estrecho (primero)
  if (estrecho.length > 0) {
    html += '<div class="seccion-titulo">';
    html += '<h2>&#9889; GÁLIBO ESTRECHO (L1-L5, LM1)</h2><div class="seccion-linea"></div>';
    html += '<span class="seccion-badge">' + estrecho.length + ' grupos</span></div>';
    html += '<div class="grupos-grid">' + estrecho.map(g => tarjetaHTML(g, g.recinto === 'VENTAS' ? 'ventas' : 'aluche')).join('') + '</div>';
  }
  
  // Sección Gálibo Ancho (después)
  if (ancho.length > 0) {
    html += '<div class="seccion-titulo" style="margin-top: 24px;">';
    html += '<h2>&#9654; GÁLIBO ANCHO (L6-L12)</h2><div class="seccion-linea"></div>';
    html += '<span class="seccion-badge">' + ancho.length + ' grupos</span></div>';
    html += '<div class="grupos-grid">' + ancho.map(g => tarjetaHTML(g, g.recinto === 'VENTAS' ? 'ventas' : 'aluche')).join('') + '</div>';
  }

  // Grupos sin OT (pendientes de asignar)
  if (sinOT.length > 0) {
    html += '<div class="seccion-titulo sin-ot" style="margin-top: 24px;">';
    html += '<h2>&#9203; SIN OT / PENDIENTES DE ASIGNAR</h2><div class="seccion-linea"></div>';
    html += '<span class="seccion-badge">' + sinOT.length + ' grupos</span></div>';
    html += '<div class="grupos-grid">' + sinOT.map(g => tarjetaHTML(g, g.recinto === 'VENTAS' ? 'ventas' : 'aluche')).join('') + '</div>';
  }

  // Rebajados
  if (rebajados.length > 0) {
    html += '<div class="rebajados"><div class="rebajados-titulo">Rebajados</div>';
    html += rebajados.map(r => '<div class="rebajado-row">' + r.nombre + (r.obs ? ' <span class="obs">— ' + r.obs + '</span>' : '') + '</div>').join('');
    html += '</div>';
  }

  html += '<div class="anotaciones-espacio"><div class="anotaciones-titulo">&#9998; Anotaciones del turno:</div></div>';

  document.getElementById('contenido').innerHTML = html;
  document.getElementById('btnImprimir').style.display = 'block';
}

function tarjetaHTML(g, cssClass) {
  const esTrio = g.p3 && g.p3.length > 0;

  let header = '<div class="card-header ' + cssClass + '">';
  header += '<div class="grupo-num">' + (g.recinto === 'ALUCHE' ? 'A' : 'V') + g.num + '</div>';
  if (g.linea) header += '<div class="linea-badge">' + g.linea + '</div>';
  if (esTrio) header += '<div class="trio-badge">Trío</div>';
  header += '</div>';

  let ots = '';
  if (g.ot1 || g.ot2) {
    ots = '<div class="ots-section">';
    if (g.ot1) ots += '<div class="ot-row"><div class="ot-num">' + g.ot1 + '</div><div class="ot-desc">' + g.denom1 + '</div></div>';
    if (g.ot2) ots += '<div class="ot-row"><div class="ot-num">' + g.ot2 + '</div><div class="ot-desc">' + g.denom2 + '</div></div>';
    ots += '</div>';
  }

  let info = '';
  if (g.furgoneta || g.telefono) {
    info = '<div class="info-destacada">';
    if (g.furgoneta) info += '<div class="info-item"><span class="info-label">&#128663; Furgoneta:</span><span class="info-val">' + g.furgoneta + '</span></div>';
    if (g.telefono) info += '<div class="info-item"><span class="info-label">&#128222; Teléfono:</span><span class="info-val">' + g.telefono + '</span></div>';
    info += '</div>';
  }

  let obs = '';
  if (g.observaciones) obs = '<div class="obs-destacada">&#9888; ' + g.observaciones + '</div>';

  let personas = '';
  if (g.p1) personas += personaHTML(g.p1, g.dne1, g.cat1);
  if (g.p2) personas += personaHTML(g.p2, g.dne2, g.cat2);
  if (esTrio) personas += personaHTML(g.p3, g.dne3, g.cat3);

  return '<div class="grupo-card">' + header +
    '<div class="card-main">' + ots + info + obs + '</div>' +
    '<div class="card-personas">' + personas + '</div>' +
    '</div>';
}

function personaHTML(nombre, dne, cat) {
  const esAux = cat.toUpperCase().includes('AUXILIAR');
  const claseAv = esAux ? 'av-aux' : (cat.toUpperCase().includes('TRIO') ? 'av-trio' : 'av-ofi');
  return '<div class="persona-row">' +
    '<div class="avatar ' + claseAv + '">' + nombre.charAt(0) + '</div>' +
    '<div class="pinfo">' +
      '<div class="nombre">' + nombre + '</div>' +
      '<div class="detalles">' +
        (dne ? '<span class="dne">DNE ' + dne + '</span>' : '') +
        (dne && cat ? '<span class="sep">·</span>' : '') +
        (cat ? '<span class="cargo">' + cat + '</span>' : '') +
      '</div>' +
    '</div></div>';
}

</script>
</body>
</html>
