<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupos del Día - Metro de Madrid Señales</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #dce8f5; min-height: 100vh; }

    header { background: #1a5fa8; padding: 12px 24px; display: flex; align-items: center; gap: 14px; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
    .header-text { flex: 1; }
    .header-text h1 { font-size: 20px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
    .header-text p { font-size: 11px; color: rgba(255,255,255,.8); margin-top: 2px; }
    .badge { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); border-radius: 8px; padding: 6px 14px; text-align: center; }
    .badge .turno { font-size: 14px; font-weight: 700; color: #fff; letter-spacing: 2px; }
    .badge .fecha { font-size: 10px; color: rgba(255,255,255,.75); margin-top: 2px; }

    .container { max-width: 1000px; margin: 16px auto; padding: 0 12px 30px; }

    .instrucciones { background: white; border-radius: 10px; padding: 14px 18px; margin-bottom: 12px; border-left: 4px solid #1a5fa8; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
    .instrucciones h3 { color: #1a5fa8; font-size: 13px; margin-bottom: 6px; }
    .instrucciones ol { margin-left: 16px; font-size: 11px; color: #444; line-height: 1.8; }
    .instrucciones code { background: #f0f5fb; padding: 1px 4px; border-radius: 3px; font-size: 10px; color: #1a5fa8; }

    .controles { background: white; border-radius: 10px; padding: 12px 18px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.06); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .controles label { font-size: 12px; font-weight: 600; color: #333; }
    .controles input[type="date"] { font-size: 12px; padding: 5px 8px; border: 1px solid #ccc; border-radius: 5px; }
    .controles input[type="file"] { font-size: 12px; flex: 1; min-width: 180px; }

    .btn { border: none; border-radius: 7px; padding: 8px 18px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-cargar { background: #1a5fa8; color: white; }
    .btn-cargar:hover { background: #0d3d6e; }
    .btn-imprimir { background: #2ecc71; color: white; display: none; }
    .btn-imprimir:hover { background: #27ae60; }

    .seccion-titulo { display: flex; align-items: center; gap: 10px; margin: 20px 0 10px; }
    .seccion-titulo h2 { font-size: 15px; font-weight: 700; color: #1a5fa8; text-transform: uppercase; letter-spacing: 0.8px; }
    .seccion-linea { flex: 1; height: 2px; background: #1a5fa8; border-radius: 2px; }
    .seccion-badge { background: #1a5fa8; color: #fff; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 16px; }

    .galibo-titulo { font-size: 12px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.8px; margin: 10px 0 6px; padding-left: 6px; border-left: 3px solid #1a5fa8; }

    .grupos-grid { display: flex; flex-direction: column; gap: 4px; }

    .grupo-card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,.07);
      display: flex;
      flex-direction: row;
      align-items: stretch;
      page-break-inside: avoid;
    }

    .card-main {
      flex: 1;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .grupo-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .grupo-num-badge {
      background: #1a5fa8;
      color: white;
      font-size: 16px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .grupo-num-badge.aluche { background: #0d3d6e; }

    .linea-badge-big { background: #1a5fa8; color: #fff; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
    .linea-badge-big.aluche { background: #0d3d6e; }
    
    .trio-badge { background: #ff8c00; color: #fff; font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 12px; text-transform: uppercase; }

    .ots-block { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
    .ot-item { display: flex; align-items: flex-start; gap: 6px; }
    .ot-num-big { background: #1a5fa8; color: white; font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 4px; min-width: 70px; text-align: center; flex-shrink: 0; }
    .ot-desc-big { font-size: 13px; font-weight: 600; color: #222; line-height: 1.3; }

    .info-destacada {
      margin-top: 6px;
      padding: 6px 10px;
      background: #fff9e6;
      border-left: 3px solid #ffa500;
      border-radius: 0 4px 4px 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .info-destacada-row { font-size: 11px; display: flex; align-items: center; gap: 6px; }
    .info-destacada-label { font-weight: 700; color: #ff8c00; min-width: 70px; }
    .info-destacada-val { color: #333; font-weight: 600; }

    .obs-destacada {
      margin-top: 4px;
      padding: 6px 10px;
      background: #ffe6e6;
      border-left: 4px solid #cc0000;
      border-radius: 0 4px 4px 0;
      font-size: 12px;
      font-weight: 700;
      color: #cc0000;
      line-height: 1.4;
    }

    .card-personas {
      min-width: 240px;
      max-width: 280px;
      padding: 8px 10px;
      background: #f8fafd;
      border-left: 2px solid #e0e6f0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
    }

    .persona-mini {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .avatar-mini { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 10px; color: #fff; flex-shrink: 0; }
    .av-aux { background: #1a5fa8; } .av-ofi { background: #0d3d6e; } .av-trio { background: #ff8c00; }
    
    .pinfo-mini { flex: 1; min-width: 0; }
    .pinfo-mini .nombre { font-size: 11px; font-weight: 600; color: #333; line-height: 1.2; }
    .pinfo-mini .dne { font-size: 9px; color: #888; }
    .pinfo-mini .cargo { font-size: 9px; color: #1a5fa8; font-weight: 600; text-transform: uppercase; margin-top: 1px; }

    .empty-state { text-align: center; padding: 50px 20px; color: #888; }
    .empty-state .icon { font-size: 42px; margin-bottom: 12px; }
    .no-grupos { color: #888; padding: 14px; font-size: 12px; }

    .anotaciones-espacio {
      margin-top: 20px;
      padding: 16px;
      background: white;
      border-radius: 8px;
      border: 2px dashed #ccc;
      min-height: 100px;
    }
    .anotaciones-titulo { font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; margin-bottom: 8px; }

    @media print {
      @page { size: A4 portrait; margin: 8mm; }
      body { background: white; font-size: 10px; }
      header { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; padding: 6px 12px; }
      .header-text h1 { font-size: 14px; }
      .container { margin: 2px auto; padding: 0; max-width: 100%; }
      .instrucciones, .controles, .btn-imprimir { display: none !important; }
      .seccion-titulo { margin: 6px 0 4px; }
      .galibo-titulo { margin: 4px 0 3px; font-size: 10px; }
      .grupo-card { box-shadow: none; border: 1px solid #ccc; margin-bottom: 3px; }
      .grupo-num-badge, .linea-badge-big, .ot-num-big, .avatar-mini, .seccion-linea, .seccion-badge, .info-destacada, .obs-destacada { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .card-personas { min-width: 200px; max-width: 240px; }
      .anotaciones-espacio { min-height: 60px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-text">
    <h1>&#128338; Grupos del Día</h1>
    <p>Metro de Madrid &mdash; Señales</p>
  </div>
  <div class="badge">
    <div class="turno" id="turno-badge">NOCHE</div>
    <div class="fecha" id="fecha-badge">-</div>
  </div>
</header>

<div class="container">
  <div class="instrucciones">
    <h3>&#128196; Cómo cargar los grupos</h3>
    <ol>
      <li>Ejecuta <code>Generar Grupos</code> en el Excel</li>
      <li>Descarga el Excel (<strong>Archivo → Descargar una copia</strong>)</li>
      <li>Selecciona fecha y archivo, pulsa <strong>Cargar grupos</strong></li>
    </ol>
  </div>

  <div class="controles">
    <label>&#128197; Fecha:</label>
    <input type="date" id="fechaInput" />
    <label>&#128194; Excel:</label>
    <input type="file" id="fileInput" accept=".xlsx,.xls" />
    <button class="btn btn-cargar" onclick="cargarExcel()">Cargar grupos</button>
    <button class="btn btn-imprimir" id="btnImprimir" onclick="window.print()">&#128438; Imprimir</button>
  </div>

  <div id="contenido">
    <div class="empty-state">
      <div class="icon">&#128203;</div>
      <p>Selecciona un archivo Excel</p>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>

const GALIBO_ESTRECHO = ['L01','L1','L02','L2','L03','L3','L04','L4','L05','L5','LM1'];
const GALIBO_ANCHO = ['L06','L6','L07','L7','L08','L8','L09','L9','L10','L11','L12'];

function esEstrecho(linea) {
  const l = linea.toUpperCase().trim();
  return GALIBO_ESTRECHO.some(g => l === g || l.startsWith(g + '-'));
}

function cargarExcel() {
  const fileInput = document.getElementById('fileInput');
  const file = fileInput.files[0];
  if (!file) { alert('Selecciona un archivo Excel'); return; }

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const sheetName = wb.SheetNames.find(n => n.toUpperCase() === 'ASIGNACIONES');
      if (!sheetName) { alert('No se encuentra ASIGNACIONES.\nEjecuta el script primero.'); return; }

      const sheet = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false });
      if (rows.length < 2) { alert('ASIGNACIONES vacía.'); return; }

      const fechaInput = document.getElementById('fechaInput').value;
      let fechaFiltro = '';
      if (fechaInput) {
        const p = fechaInput.split('-');
        fechaFiltro = p[2] + '/' + p[1] + '/' + p[0];
      }

      const grupos = [];
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if (!r[0] || r[0].toString().startsWith('**')) continue;
        const fechaFila = (r[0]||'').toString().trim();
        if (fechaFiltro && fechaFila !== fechaFiltro) continue;
        grupos.push({
          fecha: fechaFila, recinto: (r[1]||'').toString().toUpperCase().trim(),
          num: r[2]||'',
          p1: (r[3]||'').toString().trim(), dne1: (r[4]||'').toString().trim(), cat1: (r[5]||'').toString().trim(),
          p2: (r[6]||'').toString().trim(), dne2: (r[7]||'').toString().trim(), cat2: (r[8]||'').toString().trim(),
          p3: (r[9]||'').toString().trim(), dne3: (r[10]||'').toString().trim(), cat3: (r[11]||'').toString().trim(),
          linea: (r[12]||'').toString().trim(),
          ot1: (r[13]||'').toString().trim(), denom1: (r[14]||'').toString().trim(),
          ot2: (r[15]||'').toString().trim(), denom2: (r[16]||'').toString().trim(),
          furgoneta: (r[17]||'').toString().trim(), telefono: (r[18]||'').toString().trim(),
          observaciones: (r[19]||'').toString().trim()
        });
      }

      if (grupos.length === 0) { alert(fechaFiltro ? 'No hay grupos para ' + fechaFiltro : 'No hay grupos.'); return; }
      mostrarGrupos(grupos, fechaFiltro);
    } catch(err) { alert('Error: ' + err.message); }
  };
  reader.readAsArrayBuffer(file);
}

function mostrarGrupos(grupos, fechaFiltro) {
  document.getElementById('fecha-badge').textContent = fechaFiltro || 'Todos';

  const ventas = grupos.filter(g => g.recinto === 'VENTAS');
  const aluche = grupos.filter(g => g.recinto === 'ALUCHE');

  const vEstrecho = ventas.filter(g => esEstrecho(g.linea));
  const vAncho = ventas.filter(g => !esEstrecho(g.linea));
  const aEstrecho = aluche.filter(g => esEstrecho(g.linea));
  const aAncho = aluche.filter(g => !esEstrecho(g.linea));

  [vEstrecho, vAncho, aEstrecho, aAncho].forEach(arr => arr.sort((a, b) => a.linea.localeCompare(b.linea)));

  let html = '';
  html += seccionHTML('Ventas', ventas.length, 'ventas', vEstrecho, vAncho);
  html += seccionHTML('Aluche', aluche.length, 'aluche', aEstrecho, aAncho);
  html += '<div class="anotaciones-espacio"><div class="anotaciones-titulo">&#9998; Anotaciones del turno:</div></div>';

  document.getElementById('contenido').innerHTML = html;
  document.getElementById('btnImprimir').style.display = 'block';
}

function seccionHTML(nombre, total, cssClass, estrecho, ancho) {
  let html = '<div class="seccion-titulo">';
  html += '<h2>&#128198; ' + nombre + '</h2><div class="seccion-linea"></div>';
  html += '<span class="seccion-badge">' + total + ' grupos</span></div>';

  if (estrecho.length > 0) {
    html += '<div class="galibo-titulo">&#9889; Gálibo estrecho (L1-L5, LM1)</div>';
    html += '<div class="grupos-grid">' + estrecho.map(g => tarjetaHTML(g, cssClass)).join('') + '</div>';
  }
  if (ancho.length > 0) {
    html += '<div class="galibo-titulo">&#9654; Gálibo ancho (L6-L12)</div>';
    html += '<div class="grupos-grid">' + ancho.map(g => tarjetaHTML(g, cssClass)).join('') + '</div>';
  }
  if (estrecho.length === 0 && ancho.length === 0) html += '<p class="no-grupos">No hay grupos.</p>';
  return html;
}

function tarjetaHTML(g, cssClass) {
  const esTrio = g.p3 && g.p3.length > 0;

  let header = '<div class="grupo-header">';
  header += '<div class="grupo-num-badge ' + cssClass + '">Grupo ' + g.num + '</div>';
  if (g.linea) header += '<div class="linea-badge-big ' + cssClass + '">' + g.linea + '</div>';
  if (esTrio) header += '<span class="trio-badge">Trío</span>';
  header += '</div>';

  let ots = '';
  if (g.ot1 || g.ot2) {
    ots = '<div class="ots-block">';
    if (g.ot1) ots += '<div class="ot-item"><div class="ot-num-big">' + g.ot1 + '</div><div class="ot-desc-big">' + g.denom1 + '</div></div>';
    if (g.ot2) ots += '<div class="ot-item"><div class="ot-num-big">' + g.ot2 + '</div><div class="ot-desc-big">' + g.denom2 + '</div></div>';
    ots += '</div>';
  }

  let info = '';
  if (g.furgoneta || g.telefono) {
    info = '<div class="info-destacada">';
    if (g.furgoneta) info += '<div class="info-destacada-row"><span class="info-destacada-label">&#128663; Furgoneta:</span><span class="info-destacada-val">' + g.furgoneta + '</span></div>';
    if (g.telefono) info += '<div class="info-destacada-row"><span class="info-destacada-label">&#128222; Teléfono:</span><span class="info-destacada-val">' + g.telefono + '</span></div>';
    info += '</div>';
  }

  let obs = '';
  if (g.observaciones) obs = '<div class="obs-destacada">&#9888; ' + g.observaciones + '</div>';

  let personas = '';
  if (g.p1) personas += personaMini(g.p1, g.dne1, g.cat1);
  if (g.p2) personas += personaMini(g.p2, g.dne2, g.cat2);
  if (esTrio) personas += personaMini(g.p3, g.dne3, g.cat3);

  return '<div class="grupo-card">' +
    '<div class="card-main">' + header + ots + info + obs + '</div>' +
    '<div class="card-personas">' + personas + '</div>' +
    '</div>';
}

function personaMini(nombre, dne, cat) {
  const esAux = cat.toUpperCase().includes('AUXILIAR');
  const claseAv = esAux ? 'av-aux' : (cat.toUpperCase().includes('TRIO') ? 'av-trio' : 'av-ofi');
  return '<div class="persona-mini">' +
    '<div class="avatar-mini ' + claseAv + '">' + nombre.charAt(0) + '</div>' +
    '<div class="pinfo-mini">' +
      '<div class="nombre">' + nombre + '</div>' +
      (dne ? '<div class="dne">DNE: ' + dne + '</div>' : '') +
      '<div class="cargo">' + (cat||'') + '</div>' +
    '</div></div>';
}

</script>
</body>
</html>
